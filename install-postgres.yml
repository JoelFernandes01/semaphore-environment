---
- name: Instalar e Configurar o PostgreSQL 17 no IP 10.0.39.41
  hosts: db_postgres_novo
  gather_facts: true
  tasks:
    - name: Instalar dependências iniciais do APT (Incluindo CA-Certificates para HTTPS)
      ansible.builtin.apt:
        name:
          - gnupg2
          - wget
          - ca-certificates
          - apt-transport-https
        state: present
        update_cache: true

    # MÉTODOS MODERNOS PARA SUBSTITUIR O APT-KEY DEPRECIADO NO UBUNTU 26.04
    - name: Garantir que o diretório keyrings existe
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Importar a chave oficial de criptografia do PostgreSQL (Moderno)
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/postgresql.asc
        mode: '0644'

    - name: Adicionar o repositório oficial do PostgreSQL ao sistema (Forçado HTTPS + Resolute)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt resolute-pgdg main"
        state: present
        update_cache: true

    - name: Instalar o servidor PostgreSQL 17 e bibliotecas de conexão Python
      ansible.builtin.apt:
        name:
          - postgresql-17
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Configurar o PostgreSQL para escutar conexões de rede externas
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
        state: present
      notify: Restart PostgreSQL

    - name: Configurar o pg_hba.conf para aceitar conexões vindas da rede interna do Swarm
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host    all             all             10.0.39.0/24            md5"
        state: present
      notify: Restart PostgreSQL

    - name: Garantir que o serviço do PostgreSQL está ativo no sistema
      ansible.builtin.systemd_service:
        name: postgresql
        state: started
        enabled: true

    - name: Forçar o reinício do banco de dados (flush de handlers)
      ansible.builtin.meta: flush_handlers

    - name: Criar o usuário de acesso administrativo do PatchMon
      community.postgresql.postgresql_user:
        name: patchmon
        password: "Nov@Senh@"
        role_attr_flags: SUPERUSER
      become_user: postgres

    - name: Criar a base de dados patchmondb associada ao usuário
      community.postgresql.postgresql_db:
        name: patchmondb
        owner: patchmon
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
